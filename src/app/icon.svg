<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Circular review arc (top-right) -->
  <path
    d="M23 8.5 A9 9 0 1 1 9 16"
    stroke="rgba(255,255,255,0.35)"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Arrow head on the arc -->
  <polyline
    points="20.5,6 23,8.5 20.5,11"
    stroke="rgba(255,255,255,0.35)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Lock shackle -->
  <path
    d="M11.5 15v-3.5a4.5 4.5 0 0 1 9 0V15"
    stroke="white"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Lock body -->
  <rect x="9" y="15" width="14" height="10" rx="2.5" fill="white"/>

  <!-- Keyhole -->
  <circle cx="16" cy="19.5" r="1.8" fill="url(#bg)"/>
  <rect x="15.2" y="20.8" width="1.6" height="2.2" rx="0.8" fill="url(#bg)"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
</svg>
